<script>
    let opcaoSelecionada = 'sedex'; // SEDEX é o padrão

    function selecionarOpcao(opcao) {
        opcaoSelecionada = opcao;

        // Atualiza a classe selecionada
        document.querySelectorAll('.card-opcao').forEach(card => {
            card.classList.remove('selecionado');
        });
        document.getElementById(opcao).classList.add('selecionado');
    }

    document.getElementById('continuarEnvio').addEventListener('click', function() {
        if (opcaoSelecionada) {
            localStorage.setItem('freteEscolhido', opcaoSelecionada);
            if (opcaoSelecionada === 'sedex') {
                window.location. href="../type-sedex.html" + window.location.search;
            } else {
                window.location. href="../type-pac.html" + window.location.search;
            }
        }
    });
</script>
