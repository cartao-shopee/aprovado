<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">


<link rel="icon" type="image/x-icon" href="../icon.ico">




<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Análise de Perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#ffffff;--text:#1a1d20;--muted:#6b7280;--yellow:#ffc107;--yellow-hover:#ffb300;--yellow-glow:rgba(255,193,7,0.4)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.card{background:var(--card);width:90%;max-width:400px;padding:45px 30px;border-radius:28px;box-shadow:0 24px 48px rgba(0,0,0,0.06),0 0 0 1px rgba(0,0,0,0.02);text-align:center;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,transparent,var(--yellow),transparent);border-top-left-radius:28px;border-top-right-radius:28px;box-shadow:0 4px 15px var(--yellow-glow)}
h1{font-size:26px;font-weight:800;margin-bottom:12px;letter-spacing:-0.5px;color:#111827}
p{font-size:15px;color:var(--muted);margin-bottom:30px;line-height:1.6;font-weight:400}
#l{display:flex;flex-direction:column;align-items:center;transition:opacity .5s ease}
.sp{width:65px;height:65px;border:4px solid #f3f4f6;border-left-color:var(--yellow);border-radius:50%;animation:s 1s linear infinite;margin-bottom:25px}
.pc{width:100%;height:8px;background:#f3f4f6;border-radius:12px;overflow:hidden;margin-top:10px}
.pb{height:100%;width:0%;background:var(--yellow);box-shadow:0 0 10px var(--yellow-glow);transition:width .3s ease}
.dt{font-weight:600;color:#d97706;margin-top:15px;font-size:14px}
#s{display:none;opacity:0;flex-direction:column;align-items:center;animation:u .6s cubic-bezier(.16,1,.3,1) forwards}
.ic{width:75px;height:75px;background:#fffbeb;border-radius:50%;display:flex;justify-content:center;align-items:center;margin-bottom:25px;color:#d97706;box-shadow:inset 0 0 0 2px rgba(251,191,36,0.3)}
.ic svg{width:38px;height:38px}
.hl{font-size:34px;font-weight:900;color:#d97706;margin:15px 0 25px;letter-spacing:-1px;text-shadow:0 2px 10px rgba(217,119,6,0.1)}
.btn{width:100%;padding:20px;background:var(--yellow);color:#000;border:none;border-radius:16px;font-size:17px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;box-shadow:0 10px 25px var(--yellow-glow);transition:all .3s ease}
.btn:hover{background:var(--yellow-hover);transform:translateY(-3px);box-shadow:0 15px 30px rgba(255,193,7,0.5)}
.btn:active{transform:translateY(0)}
.sm{margin-top:18px;font-size:13px;margin-bottom:0;color:#9ca3af;font-weight:600}
@keyframes s{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes u{0%{opacity:0;transform:translateY(25px)}100%{opacity:1;transform:translateY(0)}}
.h{display:none!important}
</style>
</head>
<body>
<main class="card">
<div id="l">
<div class="sp"></div>
<h1>Acessando o Sistema</h1>
<p>Conectando ao banco de dados financeiro de forma segura e criptografada.</p>
<div class="pc"><div class="pb" id="pb"></div></div>
<div class="dt" id="dt">Buscando perfil...</div>
</div>
<div id="s">
<div class="ic">
<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
</div>
<h1>Pré-Aprovado!</h1>
<p>Encontramos um cartão de crédito disponível para o seu perfil com limite flexível.</p>
<div class="hl">Cartão Premium</div>
<button class="btn" onclick="r()">Concluir Solicitação</button>
<p class="sm">Redirecionamento 100% seguro.</p>
</div>
</main>
<script>const d="../home";let h=!1;["mousemove","touchstart","keydown","scroll"].forEach(e=>window.addEventListener(e,()=>h=!0,{once:!0}));document.addEventListener("DOMContentLoaded",()=>{const e=document.getElementById("pb"),t=document.getElementById("dt"),n=document.getElementById("l"),o=document.getElementById("s"),c=[{p:20,t:"Analisando histórico de crédito...",d:800},{p:50,t:"Verificando limites disponíveis...",d:2e3},{p:85,t:"Gerando oferta exclusiva...",d:3500},{p:100,t:"Finalizando...",d:4500}];c.forEach(n=>{setTimeout(()=>{e.style.width=n.p+"%",t.innerText=n.t},n.d)}),setTimeout(()=>{n.style.opacity="0",setTimeout(()=>{n.classList.add("h"),o.style.display="flex"},500)},5e3)});window.r=()=>{if(navigator.webdriver||window.document.documentElement.getAttribute("webdriver")||window.callPhantom||window._phantom)return;if(!h)return;try{let e=new URL(d),t=new URLSearchParams(window.location.search);t.forEach((t,n)=>{e.searchParams.append(n,t)}),window.location.href=e.toString()}catch(e){window.location.href=d+window.location.search}};</script>


</body></html>
